<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CPM Uzbekistan Ultimate 3D</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #020408; font-family: system-ui, sans-serif; color: #fff; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

        /* HUD top compact panel */
        #hud {
            position: absolute; top: 10px; left: 10px; z-index: 10;
            background: rgba(10, 14, 26, 0.85); border: 1px solid rgba(0, 229, 255, 0.4);
            border-radius: 10px; padding: 6px 12px; font-size: 11px; display: flex; gap: 12px; align-items: center;
        }
        #hud b { color: #00e5ff; font-size: 13px; }

        .top-btns { position: absolute; top: 10px; right: 10px; z-index: 10; display: flex; gap: 6px; }
        .top-btns button {
            padding: 6px 10px; background: rgba(0, 229, 255, 0.25); border: 1px solid #00e5ff;
            color: #fff; border-radius: 6px; font-weight: bold; font-size: 10px; cursor: pointer;
        }

        .ui-panel {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 85%; max-width: 340px; background: rgba(10, 14, 26, 0.95);
            border: 1px solid rgba(0, 229, 255, 0.5); border-radius: 14px;
            padding: 14px; backdrop-filter: blur(10px); display: none; z-index: 100; text-align: center;
        }

        h2 { color: #00e5ff; text-transform: uppercase; margin-bottom: 6px; font-size: 15px; }
        p { margin: 3px 0; font-size: 11px; color: #ccc; }

        button.btn {
            width: 100%; padding: 9px; margin: 4px 0;
            background: linear-gradient(135deg, #008cba, #005f73);
            border: none; color: white; border-radius: 6px; font-weight: bold; font-size: 11px; cursor: pointer;
        }
        .btn-success { background: linear-gradient(135deg, #2ed573, #1e90ff); }
        .btn-danger { background: linear-gradient(135deg, #ff4757, #c9302c); }
        .btn-purple { background: linear-gradient(135deg, #9b59b6, #8e44ad); }

        #touch-controls { 
            position: absolute; bottom: 12px; left: 0; width: 100%; 
            display: flex; justify-content: space-between; padding: 0 12px; 
            pointer-events: none; z-index: 20; 
        }
        .touch-group { display: flex; gap: 6px; pointer-events: auto; }
        .touch-btn { 
            width: 50px; height: 50px; background: rgba(255,255,255,0.15); 
            border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            font-size: 15px; font-weight: bold; border: 1px solid rgba(255,255,255,0.3); color: #fff;
        }
        .touch-btn:active { background: rgba(0,229,255,0.6); transform: scale(0.92); }
        #btn-gas { background: rgba(46, 213, 115, 0.4); border-color: #2ed573; }
        #btn-brake { background: rgba(255, 71, 87, 0.4); border-color: #ff4757; }

        #drift-score {
            position: absolute; top: 50px; width: 100%; text-align: center;
            font-size: 20px; font-weight: bold; color: #ff9f43; text-shadow: 0 0 8px #ff9f43; display: none; z-index: 5;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="hud">
        <div>Tezlik: <b id="speed">0</b> km/h</div>
        <div>Tangalar: <b id="coins" style="color: #ffd700;">0</b> $</div>
    </div>

    <div class="top-btns">
        <button onclick="switchCamera()">🎥 KAMERA</button>
        <button onclick="togglePause()">⏸ PAUZA</button>
    </div>

    <div id="drift-score">DRIFT: +<span id="drift-val">0</span> PTS</div>

    <div id="pause-menu" class="ui-panel">
        <h2>PAUZA</h2>
        <button class="btn btn-success" onclick="togglePause()">▶ Davom Ettirish</button>
        <button class="btn btn-purple" onclick="openPanel('garage-menu')">🚘 Garaj va Tyuning</button>
        <button class="btn" onclick="openPanel('settings-menu')">⚙️ Sozlamalar</button>
        <button class="btn btn-danger" onclick="resetPosition()">🔄 Mashinani Tiklash</button>
    </div>

    <div id="garage-menu" class="ui-panel">
        <h2>GARAGE & TUNING</h2>
        <p id="car-name" style="font-weight: bold; color: #00e5ff;">Nexia 3 / Cobalt</p>
        <button class="btn" onclick="changeCarColor()">🎨 Korpus Rangi</button>
        <button class="btn" onclick="changeWheelColor()">⚙️ Diska Rangi</button>
        <button class="btn" onclick="toggleNeon()">💡 Neon Chiroq: <span id="neon-status">ON</span></button>
        <button class="btn btn-success" onclick="upgradeStat('speed')">⚡ Engine Top Speed (200$)</button>
        <button class="btn btn-danger" onclick="openPanel('pause-menu')">Orqaga</button>
    </div>

    <div id="settings-menu" class="ui-panel">
        <h2>SOZLAMALAR</h2>
        <p>Grafika Sifati (FPS Optimallashtirish):</p>
        <button class="btn" onclick="setGraphics('low')">⚡ Past (Yuqori FPS / Qotmaydi)</button>
        <button class="btn btn-success" onclick="setGraphics('high')">✨ Yuqori (HD Render)</button>
        <button class="btn btn-danger" onclick="openPanel('pause-menu')" style="margin-top: 10px;">Orqaga</button>
    </div>

    <div id="touch-controls">
        <div class="touch-group">
            <div class="touch-btn" id="btn-left">◀</div>
            <div class="touch-btn" id="btn-right">▶</div>
        </div>
        <div class="touch-group">
            <div class="touch-btn" id="btn-nitro">🔥</div>
            <div class="touch-btn" id="btn-brake">🛑</div>
            <div class="touch-btn" id="btn-gas">⚡</div>
        </div>
    </div>

    <script>
        let isPaused = false;
        let neonEnabled = true;

        // --- 5. AUDIO EFFECTS (Web Audio API - Yengil va tez) ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
        }

        function playSound(freq, duration, type="sine") {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e){}
        }

        // --- SCENE SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x05070f);
        scene.fog = new THREE.FogExp2(0x05070f, 0.0025);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(1);
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        // 3. DINAMIK TUNGI/KUNDUZGI REJIM VA YORITGICHLAR
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(100, 150, 50);
        scene.add(dirLight);

        // YO'LLAR (4-Taraflama Chorraha va Trassalar)
        const roadMat = new THREE.MeshBasicMaterial({ color: 0x11141d });
        const roadGroup = new THREE.Group();
        
        const mainRoad = new THREE.Mesh(new THREE.PlaneGeometry(32, 3000), roadMat);
        mainRoad.rotation.x = -Math.PI / 2;
        roadGroup.add(mainRoad);

        const crossRoad = new THREE.Mesh(new THREE.PlaneGeometry(3000, 32), roadMat);
        crossRoad.rotation.x = -Math.PI / 2;
        roadGroup.add(crossRoad);

        scene.add(roadGroup);

        // Neon Binolar (Tungi Shahar Atmosferasi)
        const bldgGeo = new THREE.BoxGeometry(18, 40, 18);
        const bldgMat = new THREE.MeshBasicMaterial({ color: 0x0a0f1d });
        for(let z = -800; z < 800; z += 60) {
            if(Math.abs(z) < 40) continue;
            [-32, 32].forEach(x => {
                const b = new THREE.Mesh(bldgGeo, bldgMat);
                b.position.set(x, 20, z);
                scene.add(b);
            });
        }

        // 4. YO'LDAGI TRAFIK MASHINALARI (Damas, Sedanda to'siqlar)
        const trafficCars = [];
        const trafficGeo = new THREE.BoxGeometry(2, 1.2, 3.8);
        const trafficMat = new THREE.MeshBasicMaterial({ color: 0x555555 });
        
        for(let i = 0; i < 8; i++) {
            const tCar = new THREE.Mesh(trafficGeo, trafficMat);
            tCar.position.set((Math.random() > 0.5 ? 6 : -6), 0.6, (Math.random() - 0.5) * 600);
            scene.add(tCar);
            trafficCars.push(tCar);
        }

        // CAR BUILDER (Neon Chiroq va Faralar bilan)
        let carColor = 0x00e5ff;
        let wheelColor = 0x111111;
        let playerCar, neonLight;

        function buildCarMesh(cColor, wColor) {
            const group = new THREE.Group();
            
            // Korpus
            const body = new THREE.Mesh(
                new THREE.BoxGeometry(2.0, 0.7, 4.0),
                new THREE.MeshBasicMaterial({ color: cColor })
            );
            body.position.y = 0.6;
            group.add(body);

            // Kabina
            const cabin = new THREE.Mesh(
                new THREE.BoxGeometry(1.5, 0.6, 1.8),
                new THREE.MeshBasicMaterial({ color: 0x050505 })
            );
            cabin.position.set(0, 1.2, -0.2);
            group.add(cabin);

            // Faralar
            const headlightGeo = new THREE.BoxGeometry(0.4, 0.2, 0.1);
            const headlightMat = new THREE.MeshBasicMaterial({ color: 0xffffaa });
            const hl1 = new THREE.Mesh(headlightGeo, headlightMat); hl1.position.set(-0.7, 0.6, 2.0);
            const hl2 = new THREE.Mesh(headlightGeo, headlightMat); hl2.position.set(0.7, 0.6, 2.0);
            group.add(hl1); group.add(hl2);

            // 3. Neon Chiroq (Mashina tagida)
            neonLight = new THREE.PointLight(0x00e5ff, 2, 8);
            neonLight.position.set(0, 0.1, 0);
            group.add(neonLight);

            return group;
        }

        playerCar = buildCarMesh(carColor, wheelColor);
        scene.add(playerCar);

        // CONTROLS
        const keys = { gas: false, brake: false, left: false, right: false, nitro: false };
        const setKey = (code, val) => {
            initAudio();
            const k = code.toLowerCase();
            if (k === 'w' || k === 'arrowup') keys.gas = val;
            if (k === 's' || k === 'arrowdown') keys.brake = val;
            if (k === 'a' || k === 'arrowleft') keys.left = val;
            if (k === 'd' || k === 'arrowright') keys.right = val;
            if (k === 'shift' || k === ' ') keys.nitro = val;
        };
        window.addEventListener('keydown', e => setKey(e.key, true));
        window.addEventListener('keyup', e => setKey(e.key, false));

        const bindTouch = (id, key) => {
            const el = document.getElementById(id);
            const handler = (v) => (e) => { e.preventDefault(); initAudio(); keys[key] = v; };
            el.addEventListener('touchstart', handler(true)); el.addEventListener('touchend', handler(false));
            el.addEventListener('mousedown', handler(true)); el.addEventListener('mouseup', handler(false));
        };
        bindTouch('btn-gas', 'gas'); bindTouch('btn-brake', 'brake');
        bindTouch('btn-left', 'left'); bindTouch('btn-right', 'right'); bindTouch('btn-nitro', 'nitro');

        // 2. KAMERA REJIMLARI (3 xil ko'rinish)
        let cameraMode = 0;
        function switchCamera() { cameraMode = (cameraMode + 1) % 3; }

        function togglePause() {
            isPaused = !isPaused;
            if(isPaused) openPanel('pause-menu');
            else closePanels();
        }

        function setGraphics(level) {
            if(level === 'low') renderer.setPixelRatio(0.75);
            else renderer.setPixelRatio(1.2);
            alert("Grafika sozlandi!");
        }

        // GAME LOOP
        let speed = 0, rotation = 0, coins = 0, driftScore = 0;
        let dayTime = 0;

        function animate() {
            requestAnimationFrame(animate);
            if (isPaused) return;

            // 3. Tungi/Kunduzgi Rejim Dinamikasi
            dayTime += 0.0005;
            const lightIntensity = Math.sin(dayTime) * 0.5 + 0.5;
            ambientLight.intensity = 0.2 + lightIntensity * 0.5;

            let maxSpeed = keys.nitro ? 1.7 : 1.1;
            let accel = keys.nitro ? 0.04 : 0.02;

            if (keys.gas) {
                speed = Math.min(speed + accel, maxSpeed);
                if(Math.random() < 0.1) playSound(100 + speed * 150, 0.05, "sawtooth"); // Dvigatel ovozi
            } else if (keys.brake) {
                speed = Math.max(speed - 0.03, -0.3);
                playSound(300, 0.03, "square"); // Tormoz ovozi
            } else {
                speed *= 0.96;
            }

            if (keys.nitro) playSound(600, 0.05, "triangle"); // Nitro ovozi

            if (Math.abs(speed) > 0.05) {
                if (keys.left) rotation += 0.024 * (speed > 0 ? 1 : -1);
                if (keys.right) rotation -= 0.024 * (speed > 0 ? 1 : -1);
            }

            playerCar.rotation.y = rotation;
            playerCar.translateZ(speed);

            // 4. Trafik Mashinalari Harakati
            trafficCars.forEach(tc => {
                tc.position.z += 0.3;
                if(tc.position.z > playerCar.position.z + 200) tc.position.z = playerCar.position.z - 400;
            });

            // UI Update
            document.getElementById('speed').innerText = Math.round(Math.abs(speed) * 130);
            document.getElementById('coins').innerText = coins;

            // 1. DRIFT VA OCHKO TIZIMI
            if (Math.abs(rotation) > 0.03 && Math.abs(speed) > 0.5) {
                driftScore += 5;
                coins += 1;
                document.getElementById('drift-score').style.display = 'block';
                document.getElementById('drift-val').innerText = driftScore;
                playSound(200, 0.02, "white"); // Drift g'ildirak chirillashi
            } else {
                document.getElementById('drift-score').style.display = 'none';
            }

            // 2. KAMERA KO'RINISHLARI
            if (cameraMode === 0) { // Orqadan kuzatish
                const targetPos = playerCar.position.clone().add(new THREE.Vector3(0, 3.2, -8).applyAxisAngle(new THREE.Vector3(0, 1, 0), rotation));
                camera.position.lerp(targetPos, 0.15);
                camera.lookAt(playerCar.position.clone().add(new THREE.Vector3(0, 1.0, 2)));
            } else if (cameraMode === 1) { // Rul orqasidan (1-shaxs)
                const targetPos = playerCar.position.clone().add(new THREE.Vector3(0, 1.2, 0.3).applyAxisAngle(new THREE.Vector3(0, 1, 0), rotation));
                camera.position.copy(targetPos);
                camera.lookAt(playerCar.position.clone().add(new THREE.Vector3(0, 1.1, 10).applyAxisAngle(new THREE.Vector3(0, 1, 0), rotation)));
            } else { // Cinematic (Yuqoridan)
                camera.position.set(playerCar.position.x + 12, playerCar.position.y + 14, playerCar.position.z - 12);
                camera.lookAt(playerCar.position);
            }

            renderer.render(scene, camera);
        }

        // PANEL VA TUNING FUNCTIONS
        function openPanel(id) { document.querySelectorAll('.ui-panel').forEach(p => p.style.display = 'none'); document.getElementById(id).style.display = 'block'; }
        function closePanels() { document.querySelectorAll('.ui-panel').forEach(p => p.style.display = 'none'); isPaused = false; }
        function resetPosition() { playerCar.position.set(0, 0, playerCar.position.z); rotation = 0; closePanels(); }

        function changeCarColor() { carColor = Math.floor(Math.random()*16777215); reloadCar(); }
        function changeWheelColor() { wheelColor = Math.floor(Math.random()*16777215); reloadCar(); }
        function toggleNeon() {
            neonEnabled = !neonEnabled;
            neonLight.intensity = neonEnabled ? 2 : 0;
            document.getElementById('neon-status').innerText = neonEnabled ? 'ON' : 'OFF';
        }
        function reloadCar() {
            const z = playerCar.position.z;
            scene.remove(playerCar);
            playerCar = buildCarMesh(carColor, wheelColor);
            playerCar.position.z = z;
            scene.add(playerCar);
        }
        function upgradeStat(type) {
            if(coins >= 200) { coins -= 200; alert("Dvigatel quvvati oshirildi!"); }
            else alert("Tangalar yetarli emas!");
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
