<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CPM Uzbekistan Full Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: system-ui, sans-serif; color: #fff; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

        #hud {
            position: absolute; top: 10px; left: 10px; z-index: 10;
            background: rgba(10, 14, 26, 0.85); border: 1px solid rgba(0, 229, 255, 0.4);
            border-radius: 10px; padding: 6px 12px; font-size: 11px; display: flex; gap: 10px; align-items: center;
        }
        #hud b { color: #00e5ff; font-size: 13px; }

        .top-btns { position: absolute; top: 10px; right: 10px; z-index: 10; display: flex; gap: 5px; }
        .top-btns button {
            padding: 6px 10px; background: rgba(0, 229, 255, 0.25); border: 1px solid #00e5ff;
            color: #fff; border-radius: 6px; font-weight: bold; font-size: 10px; cursor: pointer;
        }

        #race-banner {
            position: absolute; top: 60px; width: 100%; text-align: center;
            font-size: 28px; font-weight: 900; color: #ff4757; text-shadow: 0 0 10px #ff4757; display: none; z-index: 15;
        }

        .ui-panel {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 85%; max-width: 340px; background: rgba(10, 14, 26, 0.95);
            border: 1px solid rgba(0, 229, 255, 0.5); border-radius: 14px;
            padding: 14px; backdrop-filter: blur(10px); display: none; z-index: 100; text-align: center;
            max-height: 85vh; overflow-y: auto;
        }

        h2 { color: #00e5ff; text-transform: uppercase; margin-bottom: 6px; font-size: 15px; }
        p { margin: 4px 0; font-size: 11px; color: #ccc; }

        button.btn {
            width: 100%; padding: 9px; margin: 4px 0;
            background: linear-gradient(135deg, #008cba, #005f73);
            border: none; color: white; border-radius: 6px; font-weight: bold; font-size: 11px; cursor: pointer;
        }
        .btn-success { background: linear-gradient(135deg, #2ed573, #1e90ff); }
        .btn-danger { background: linear-gradient(135deg, #ff4757, #c9302c); }
        .btn-purple { background: linear-gradient(135deg, #9b59b6, #8e44ad); }

        #touch-controls { 
            position: absolute; bottom: 12px; left: 0; width: 100%; 
            display: flex; justify-content: space-between; padding: 0 12px; 
            pointer-events: none; z-index: 20; 
        }
        .touch-group { display: flex; gap: 6px; pointer-events: auto; }
        .touch-btn { 
            width: 50px; height: 50px; background: rgba(255,255,255,0.15); 
            border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            font-size: 15px; font-weight: bold; border: 1px solid rgba(255,255,255,0.3); color: #fff;
        }
        .touch-btn:active { background: rgba(0,229,255,0.6); transform: scale(0.92); }
        #btn-gas { background: rgba(46, 213, 115, 0.4); border-color: #2ed573; }
        #btn-brake { background: rgba(255, 71, 87, 0.4); border-color: #ff4757; }

        #drift-score {
            position: absolute; top: 50px; left: 10px;
            font-size: 15px; font-weight: bold; color: #ff9f43; text-shadow: 0 0 8px #ff9f43; display: none; z-index: 5;
        }
        #abs-indicator {
            position: absolute; top: 75px; left: 10px;
            font-size: 11px; font-weight: bold; color: #ff4757; display: none; z-index: 5; background: rgba(0,0,0,0.7); padding: 2px 6px; border-radius: 4px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="hud">
        <div>Tezlik: <b id="speed">0</b> km/h</div>
        <div>FPS: <b id="fps-val" style="color: #2ed573;">60</b></div>
        <div>Tangalar: <b id="coins" style="color: #ffd700;">0</b> $</div>
    </div>

    <div class="top-btns">
        <button onclick="start1vs1Race()" style="background: #ff4757; border-color: #ff6b81;">🏁 1VS1 POYGA</button>
        <button onclick="switchCamera()">🎥 KAMERA</button>
        <button onclick="togglePause()">⚙️ SOZLAMALAR</button>
    </div>

    <div id="race-banner">3</div>
    <div id="drift-score">DRIFT: +<span id="drift-val">0</span></div>
    <div id="abs-indicator">ABS SYSTEM ACTIVE</div>

    <!-- MAIN SOZLAMALAR MENYU -->
    <div id="pause-menu" class="ui-panel">
        <h2>SOZLAMALAR VA MENYU</h2>
        <button class="btn btn-success" onclick="togglePause()">▶ Davom Ettirish</button>
        <button class="btn" onclick="openPanel('settings-menu')">⚙️ FPS & Grafika Sozlamalari</button>
        <button class="btn" onclick="openPanel('physics-menu')">🏎️ ABS & Fizika Sozlamalari</button>
        <button class="btn btn-purple" onclick="openPanel('garage-menu')">🚘 Garaj & Mashinalar</button>
        <button class="btn btn-danger" onclick="resetPosition()">🔄 Pozitsiyani Tiklash</button>
    </div>

    <!-- FPS VA GRAFIKA SOZLAMALARI -->
    <div id="settings-menu" class="ui-panel">
        <h2>FPS & GRAFIKA</h2>
        <p>FPS Limiti:</p>
        <button class="btn" onclick="setFPS(30)">⚡ 30 FPS Rejimi</button>
        <button class="btn btn-success" onclick="setFPS(60)">🚀 60 FPS Rejimi</button>
        <p>Sifat (Optimallashtirish):</p>
        <button class="btn" onclick="setGraphics('low')">📉 Past Grafika (Tezkor)</button>
        <button class="btn" onclick="setGraphics('high')">✨ Yuqori Grafika (HD)</button>
        <button class="btn btn-purple" onclick="toggleTraffic()">🚗 Trafik Mashinalari: <span id="traffic-status">ON</span></button>
        <button class="btn btn-danger" onclick="openPanel('pause-menu')" style="margin-top: 8px;">Orqaga</button>
    </div>

    <!-- ABS VA FIZIKA SOZLAMALARI -->
    <div id="physics-menu" class="ui-panel">
        <h2>ABS VA FIZIKA</h2>
        <button class="btn btn-success" onclick="toggleABS()">🛑 ABS Tizimi: <span id="abs-status">YOQILGAN</span></button>
        <button class="btn" onclick="setPhysics('drift')">🏎️ Drift Rejimi</button>
        <button class="btn" onclick="setPhysics('real')">🏆 Realistik Boshqaruv</button>
        <button class="btn btn-danger" onclick="openPanel('pause-menu')" style="margin-top: 8px;">Orqaga</button>
    </div>

    <!-- GARAJ -->
    <div id="garage-menu" class="ui-panel">
        <h2>GARAJ</h2>
        <p id="car-name" style="font-weight: bold; color: #00e5ff; font-size: 13px;">Nexia-3 Sport</p>
        <button class="btn" onclick="selectCarType(0)">🚘 Nexia-3</button>
        <button class="btn" onclick="selectCarType(1)">🏎 Cobalt Sport</button>
        <button class="btn" onclick="selectCarType(2)">🚜 Tracker SUV</button>
        <button class="btn btn-purple" onclick="changeCarColor()">🎨 Rangi O'zgartirish</button>
        <button class="btn btn-danger" onclick="openPanel('pause-menu')" style="margin-top: 8px;">Orqaga</button>
    </div>

    <!-- TOUCH CONTROLS -->
    <div id="touch-controls">
        <div class="touch-group">
            <div class="touch-btn" id="btn-left">◀</div>
            <div class="touch-btn" id="btn-right">▶</div>
        </div>
        <div class="touch-group">
            <div class="touch-btn" id="btn-nitro">🔥</div>
            <div class="touch-btn" id="btn-brake">🛑</div>
            <div class="touch-btn" id="btn-gas">⚡</div>
        </div>
    </div>

    <script>
        let isPaused = false;
        let isRacing = false;
        let absEnabled = true;
        let trafficEnabled = true;
        let targetFPS = 60;
        let physicsMode = 'drift';

        // THREE.JS SETUP
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a202c);
        scene.fog = new THREE.FogExp2(0x1a202c, 0.002);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // LIGHTING
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfffaed, 0.8);
        sunLight.position.set(50, 100, 50);
        scene.add(sunLight);

        // 4 TARAFLAMA YO'LLAR
        const roadGroup = new THREE.Group();
        const roadMat = new THREE.MeshLambertMaterial({ color: 0x22252a });

        const mainRoad = new THREE.Mesh(new THREE.PlaneGeometry(36, 3000), roadMat);
        mainRoad.rotation.x = -Math.PI / 2;
        roadGroup.add(mainRoad);

        const crossRoad = new THREE.Mesh(new THREE.PlaneGeometry(3000, 36), roadMat);
        crossRoad.rotation.x = -Math.PI / 2;
        roadGroup.add(crossRoad);

        scene.add(roadGroup);

        // BINOLAR
        const bldgGeo = new THREE.BoxGeometry(20, 45, 20);
        const bldgMat = new THREE.MeshLambertMaterial({ color: 0x334155 });
        for(let z = -800; z < 800; z += 70) {
            if(Math.abs(z) < 50) continue;
            [-35, 35].forEach(x => {
                const b = new THREE.Mesh(bldgGeo, bldgMat);
                b.position.set(x, 22.5, z);
                scene.add(b);
            });
        }

        // MASHINA MODELINGI
        function createDetailedCar(colorHex, isSUV=false) {
            const car = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.3, metalness: 0.4 });
            const glassMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1, metalness: 0.9 });
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });

            const bodyHeight = isSUV ? 0.9 : 0.7;
            const body = new THREE.Mesh(new THREE.BoxGeometry(2.1, bodyHeight, 4.2), bodyMat);
            body.position.y = bodyHeight / 2 + 0.3;
            car.add(body);

            const cabinHeight = isSUV ? 0.8 : 0.6;
            const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.7, cabinHeight, 2.0), glassMat);
            cabin.position.set(0, body.position.y + cabinHeight/2 + 0.2, -0.2);
            car.add(cabin);

            const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
            wheelGeo.rotateZ(Math.PI / 2);

            const wPositions = [
                [-1.1, 0.4, 1.3], [1.1, 0.4, 1.3],
                [-1.1, 0.4, -1.3], [1.1, 0.4, -1.3]
            ];
            wPositions.forEach(pos => {
                const w = new THREE.Mesh(wheelGeo, wheelMat);
                w.position.set(...pos);
                car.add(w);
            });

            const hlGeo = new THREE.BoxGeometry(0.4, 0.2, 0.1);
            const hlMat = new THREE.MeshBasicMaterial({ color: 0xffffcc });
            const hl1 = new THREE.Mesh(hlGeo, hlMat); hl1.position.set(-0.7, body.position.y + 0.1, 2.15);
            const hl2 = new THREE.Mesh(hlGeo, hlMat); hl2.position.set(0.7, body.position.y + 0.1, 2.15);
            car.add(hl1); car.add(hl2);

            return car;
        }

        // CARS
        let carTypes = [0x00e5ff, 0xff4757, 0x2ed573];
        let currentCarIdx = 0;
        let playerCar = createDetailedCar(carTypes[0]);
        scene.add(playerCar);

        let rivalCar = createDetailedCar(0xffa500);
        rivalCar.position.set(6, 0, 0);
        scene.add(rivalCar);

        const trafficGroup = new THREE.Group();
        for(let i = 0; i < 6; i++) {
            let t = createDetailedCar(0x888888, true);
            t.position.set((i % 2 === 0 ? 9 : -9), 0, (i - 3) * 150);
            trafficGroup.add(t);
        }
        scene.add(trafficGroup);

        // CONTROLS
        const keys = { gas: false, brake: false, left: false, right: false, nitro: false };
        const setKey = (code, val) => {
            const k = code.toLowerCase();
            if (k === 'w' || k === 'arrowup') keys.gas = val;
            if (k === 's' || k === 'arrowdown') keys.brake = val;
            if (k === 'a' || k === 'arrowleft') keys.left = val;
            if (k === 'd' || k === 'arrowright') keys.right = val;
            if (k === 'shift' || k === ' ') keys.nitro = val;
        };
        window.addEventListener('keydown', e => setKey(e.key, true));
        window.addEventListener('keyup', e => setKey(e.key, false));

        const bindTouch = (id, key) => {
            const el = document.getElementById(id);
            const handler = (v) => (e) => { e.preventDefault(); keys[key] = v; };
            el.addEventListener('touchstart', handler(true)); el.addEventListener('touchend', handler(false));
            el.addEventListener('mousedown', handler(true)); el.addEventListener('mouseup', handler(false));
        };
        bindTouch('btn-gas', 'gas'); bindTouch('btn-brake', 'brake');
        bindTouch('btn-left', 'left'); bindTouch('btn-right', 'right'); bindTouch('btn-nitro', 'nitro');

        // FUNCTIONS
        function setFPS(val) { targetFPS = val; document.getElementById('fps-val').innerText = val; }
        function setGraphics(level) { renderer.setPixelRatio(level === 'low' ? 0.75 : Math.min(window.devicePixelRatio, 2)); }
        function toggleTraffic() { trafficEnabled = !trafficEnabled; trafficGroup.visible = trafficEnabled; document.getElementById('traffic-status').innerText = trafficEnabled ? 'ON' : 'OFF'; }
        function toggleABS() { absEnabled = !absEnabled; document.getElementById('abs-status').innerText = absEnabled ? 'YOQILGAN' : 'O\'CHIRILGAN'; }
        function setPhysics(mode) { physicsMode = mode; }

        function start1vs1Race() {
            isRacing = true;
            playerCar.position.set(-4, 0, playerCar.position.z);
            rivalCar.position.set(4, 0, playerCar.position.z);
            playerCar.rotation.y = 0; rivalCar.rotation.y = 0;
            
            const banner = document.getElementById('race-banner');
            banner.style.display = 'block';
            let count = 3; banner.innerText = count;

            let timer = setInterval(() => {
                count--;
                if(count > 0) banner.innerText = count;
                else if(count === 0) banner.innerText = "GO!";
                else { banner.style.display = 'none'; clearInterval(timer); }
            }, 1000);
        }

        let cameraMode = 0;
        function switchCamera() { cameraMode = (cameraMode + 1) % 3; }
        function togglePause() { isPaused = !isPaused; if(isPaused) openPanel('pause-menu'); else closePanels(); }
        function openPanel(id) { document.querySelectorAll('.ui-panel').forEach(p => p.style.display = 'none'); document.getElementById(id).style.display = 'block'; }
        function closePanels() { document.querySelectorAll('.ui-panel').forEach(p => p.style.display = 'none'); isPaused = false; }
        function resetPosition() { playerCar.position.set(0, 0, playerCar.position.z); rotation = 0; closePanels(); }

        function selectCarType(idx) {
            currentCarIdx = idx;
            const names = ["Nexia-3 Sport", "Cobalt Sport", "Tracker SUV"];
            document.getElementById('car-name').innerText = names[idx];
            const z = playerCar.position.z;
            scene.remove(playerCar);
            playerCar = createDetailedCar(carTypes[idx], idx === 2);
            playerCar.position.z = z;
            scene.add(playerCar);
        }

        function changeCarColor() {
            carTypes[currentCarIdx] = Math.floor(Math.random()*16777215);
            selectCarType(currentCarIdx);
        }

        // MAIN LOOP
        let speed = 0, rotation = 0, rivalSpeed = 0, coins = 0, driftScore = 0;
        let lastFrameTime = performance.now();

        function animate(currentTime) {
            requestAnimationFrame(animate);

            const delta = currentTime - lastFrameTime;
            const interval = 1000 / targetFPS;

            if (delta < interval) return;
            lastFrameTime = currentTime - (delta % interval);

            if (isPaused) return;

            let maxSpeed = keys.nitro ? 1.8 : 1.2;
            let accel = keys.nitro ? 0.04 : 0.02;

            if (keys.gas) speed = Math.min(speed + accel, maxSpeed);
            else if (keys.brake) {
                if (absEnabled && Math.abs(speed) > 0.5) {
                    speed = Math.max(speed - 0.025, 0);
                    document.getElementById('abs-indicator').style.display = 'block';
                } else {
                    speed = Math.max(speed - 0.05, -0.4);
                    document.getElementById('abs-indicator').style.display = 'none';
                }
            } else {
                document.getElementById('abs-indicator').style.display = 'none';
                speed *= 0.96;
            }

            let turnSpeed = physicsMode === 'drift' ? 0.028 : 0.018;

            if (Math.abs(speed) > 0.05) {
                if (keys.left) rotation += turnSpeed * (speed > 0 ? 1 : -1);
                if (keys.right) rotation -= turnSpeed * (speed > 0 ? 1 : -1);
            }

            playerCar.rotation.y = rotation;
            playerCar.translateZ(speed);

            if (isRacing) {
                rivalSpeed = Math.min(rivalSpeed + 0.02, 1.3);
                rivalCar.translateZ(rivalSpeed);
            }

            document.getElementById('speed').innerText = Math.round(Math.abs(speed) * 140);
            document.getElementById('coins').innerText = coins;

            if (Math.abs(rotation) > 0.03 && Math.abs(speed) > 0.6 && !absEnabled) {
                driftScore += 10;
                coins += 1;
                document.getElementById('drift-score').style.display = 'block';
                document.getElementById('drift-val').innerText = driftScore;
            } else {
                document.getElementById('drift-score').style.display = 'none';
            }

            if (cameraMode === 0) {
                const targetPos = playerCar.position.clone().add(new THREE.Vector3(0, 3.5, -9).applyAxisAngle(new THREE.Vector3(0, 1, 0), rotation));
                camera.position.lerp(targetPos, 0.2);
                camera.lookAt(playerCar.position.clone().add(new THREE.Vector3(0, 1.0, 3)));
            } else if (cameraMode === 1) {
                const targetPos = playerCar.position.clone().add(new THREE.Vector3(0, 1.2, 0.2).applyAxisAngle(new THREE.Vector3(0, 1, 0), rotation));
                camera.position.copy(targetPos);
                camera.lookAt(playerCar.position.clone().add(new THREE.Vector3(0, 1.1, 10).applyAxisAngle(new THREE.Vector3(0, 1, 0), rotation)));
            } else {
                camera.position.set(playerCar.position.x + 14, playerCar.position.y + 16, playerCar.position.z - 14);
                camera.lookAt(playerCar.position);
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate(performance.now());
    </script>
</body>
</html>
